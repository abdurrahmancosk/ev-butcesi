name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-camera flet-permission-handler supabase pillow

      - name: Build Android APK with Flet
        run: |
          flet build apk -vv --yes --project "HaneButcesi" --permissions camera microphone --org "com.evbutcesi.app" --android-permissions android.permission.INTERNET=true --android-permissions android.permission.VIBRATE=true --android-permissions android.permission.READ_EXTERNAL_STORAGE=true --android-permissions android.permission.WRITE_EXTERNAL_STORAGE=true --android-permissions android.permission.MANAGE_EXTERNAL_STORAGE=true --android-permissions android.permission.READ_MEDIA_IMAGES=true --android-permissions android.permission.RECORD_AUDIO=true --android-permissions android.permission.MODIFY_AUDIO_SETTINGS=true --android-permissions android.permission.POST_NOTIFICATIONS=true --android-permissions android.permission.CAMERA=true

      - name: Prepare APK File
        run: |
          mkdir -p release_dist
          find build/apk -name "*.apk" -exec cp {} release_dist/HaneButcesi.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaneButcesi-Android-APK
          path: release_dist/HaneButcesi.apk

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "En Güncel Ev Bütçesi Sürümü"
          body: |
            Bu sürüm GitHub tarafından otomatik olarak derlenmiştir.
            Aşağıdaki HaneButcesi.apk dosyasına dokunarak telefonunuza doğrudan kurabilirsiniz.
          files: release_dist/HaneButcesi.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase pillow

      - name: Build Android APK with Flet
        run: |
          yes | flet build apk --yes --project "HaneButcesi" --org "com.evbutcesi.app" --android-permissions android.permission.INTERNET=true --android-permissions android.permission.READ_EXTERNAL_STORAGE=true --android-permissions android.permission.READ_MEDIA_IMAGES=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaneButcesi-Android-APK
          path: build/apk/*.apk

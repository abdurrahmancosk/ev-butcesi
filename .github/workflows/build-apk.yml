name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase pillow

      - name: Build Android APK with Flet
        run: |
          flet build apk -vv --yes --project "HaneButcesi" --org "com.evbutcesi.app"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaneButcesi-Android-APK
          path: build/apk/*.apk
